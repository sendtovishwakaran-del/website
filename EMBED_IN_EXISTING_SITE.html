<!-- 1. Copy dragon.js into the same folder as your existing index.html. -->
<!-- 2. Put this section in your existing webpage where the dragon should appear. -->
<section class="my-dragon-section">
  <div id="my-dragon" aria-label="Friendly 3D dragon with pointer-tracking eyes" role="img"></div>
</section>
<style>
  .my-dragon-section { background:#fff8b7; border-radius:28px; overflow:hidden; }
  #my-dragon { width:100%; height: min(72vh,680px); min-height:360px; }
  #my-dragon canvas { display:block; width:100%; height:100%; }
</style>
<!-- 3. Put this module script near the end of your existing body. -->
<script type="module">
  import { mountDragon } from './dragon.js';
  mountDragon('#my-dragon');
</script>
